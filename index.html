:"boombap",bpm:90,flows:["onbeat","laidback"],rhymes:["aabb","internal","slant"],dels:["menace","gritty"],lands:["snare24","behind"],tag:"a cold, bleak 90s East Coast sound with eerie minor-key piano samples, hard grimy drums and calm menacing street realism",flow:"Steady, cold, unbothered.",rhyme:"Plain pairs. Grim inside rhymes.",cad:"Locked to the snare.",themes:"Survival, paranoia, the projects.",beat:"Eerie piano. Hard dusty drums.",voice:"Low, cold, menacing."},{id:"kdot",n:"Kendrick Lamar",k:"magnifier",f:M.powder,sound:"ren",bpm:96,flows:["synco","double","stopstart"],rhymes:["multi","internal","switch"],dels:["chars","aggressive","whisper"],lands:["shift","displace"],tag:"a modern West Coast concept-rap sound with jazz and funk-laced production, shifting voices and characters, and restless syncopated flows",flow:"Changes flow all the time.",rhyme:"Switches rhyme style mid-verse.",cad:"Moves the hit around.",themes:"The city, who you are, the fight inside.",beat:"Jazz and funk. Beat switches.",voice:"Many voices: high, low, whispered."},{id:"kast",n:"OutKast",k:"star",f:M.sage,sound:"boombap",bpm:96,flows:["double","synco","melodic"],rhymes:["multi","internal","switch"],dels:["chars","sung","adlibs"],lands:["and","triplet"],tag:"a Southern Atlanta sound with funk band instrumentation, soulful organs, playful sung hooks and quick inventive flows",flow:"Quick, playful, bouncy.",rhyme:"Inventive multi-rhymes.",cad:"Bounces on the &.",themes:"The South, love, being different.",beat:"Funk band. Organs. Big drums.",voice:"Two different voices, playful."},{id:"jay",n:"Jay-Z",k:"key",f:M.butter,sound:"boombap",bpm:94,flows:["laidback","synco","onbeat"],rhymes:["double","punch","multi"],dels:["deadpan","menace"],lands:["behind","and"],tag:"a slick late-90s New York sound with chopped soul samples, a confident effortless laid-back flow and clever double-meaning wordplay",flow:"Effortless and relaxed.",rhyme:"Clever double meanings.",cad:"Slightly behind. Cool.",themes:"Hustler to boss. Success.",beat:"Chopped soul. Crisp drums.",voice:"Calm, confident, smooth."}],pp={struggle:`*Woke up to the cold with the window letting rain in
Mama counting coins at the table, hiding pain in
Every smile she wore was a habit she was trained in
Same four walls and the same fears that I was chained in
Teachers called me trouble, never asked what I was raised in
Every page I wrote was a door I could escape in

Lights cut off, so I studied by the glow from the street
Stomach full of nothing, I was learning not to eat
Shoes with the holes, I could feel every crack in the concrete
Bills on the fridge like a tally of defeat
Still I kept a rhythm, tapping pencils to a beat
Told myself one day I'ma land on my feet

*Nobody was coming, so I kept the engine going
Winter in the hallway and the heater wasn't blowing
Pockets full of lint but my mind was overflowing
Every door was shut but I was knocking without knowing
Planting little seeds in the dirt with no sign of growing
Holding on to hope like a candle that was glowing

Every lesson came with a bruise, every one came hard
Knuckles on the wall, I got a heart that's scarred
Learned to sleep light, always half on guard
Kids playing ball in a broken-glass yard
Nothing in the bank but a library card
Windows on {place} looking like they're barred`,hustle:`Up before the sun with a plan and a one-track mind
Every hour stacked like a brick, I'm on the grind
Watching all the clocks, I refuse to fall behind
Turned a little corner to a business I designed
Looking for a door, built my own when I couldn't find
They said wait your turn, I was busy getting signed

*Started in the basement with a laptop and a statement
Every dollar counted, every late night was a payment
Learned to read a contract, every clause and every placement
Mama saw the numbers and her face was pure amazement
Never took a handout, never asked for an arrangement
Turned a cold refusal into fuel, not entertainment

Every no I ever heard just became another stack
Carry what I own in a worn-out backpack
Never had a map but I'm staying on track
Paid the debt in full and I never once looked back
Took the little bit I had and I flipped it from the lack
Now the books are balanced and the numbers in the black

*Turning every minute to an hour of power
Started in the shadow of a project tower
Freezing every morning in a lukewarm shower
Never let the bitter make the hustle go sour
Watered every dream till the concrete grew a flower
Patient like a builder, laying bricks up by the hour`,loyalty:`Day one people, yeah, they never left my side
When the wheels fell off, we still finished the ride
Swallowed all my ego, put away my pride
Every time I fell, there was a hand when I tried
Never had to wonder, never had a thing to hide
Money came around but it never could divide

Shook on it once and it's forever, that's the deal
Brothers in the struggle, what we got you cannot steal
Took a hit for me and never asked me how I feel
Patched up each other till the cuts began to heal
Promise in the parking lot, a handshake and a seal
Never had to say it, we just know that this is real

Same block, same blood since we ran around this town
When the rain came heavy, nobody let me drown
Rather share a crust than to wear a lonely crown
Trust is slow to build but it's quick to tumble down
Called at three a.m. and they were already around
Back to back forever, we don't ever turn around

*We was eating noodles but we ate them all together
Shared a coat in winter when we couldn't beat the weather
Told 'em I'ma ride for {crew}, whatever
Snakes up in the grass thinking they were being clever
Leave a brother lonely? Nah, not now and not never
Name inked on my arm, it's a bond that lasts forever`,pain:`Hospital lights got the hallway feeling cold
Last thing I remember was the hand I couldn't hold
Shoulda said I love you but the words were never told
Swapped my peace for noise and I don't know what I sold
Nineteen years and my eyes already old
Chasing every shine but it was never really gold

*Every night the doubt in the corner keeps creeping
Mama in the kitchen tryna hide that she's weeping
Secrets in my chest that I'm tired of keeping
Lying in the dark but I'm nowhere near sleeping
Planted all that love and now I'm scared of the reaping
Every little scar got a story that it's keeping

Wrote it in the margins 'cause I couldn't say the pain
Funeral in April and it's pouring down rain
Words I never said running cold through every vein
Scrubbing at the memory but I can't lift the stain
Promised I would visit, now I'll never see you again
Some things you can carry, some you never can explain

*Every single promise in this house ended up broken
Heavy is the silence when the last word's spoken
All I got left is a photo and a token
Stitched it up tight but the wound is still open
Hands on the wheel and my heart is frozen
Dreaming that you're here till the moment I've woken`,triumph:`Took a broken ladder and I climbed it to the top
Every time they doubted me, I never learned to stop
Built it brick by brick, never waited for a drop
Now the city's waiting on the next one that I drop
From a bus stop bench to the top spot in one hop
Used to sweep the floors in the same old corner shop

*Now my name is ringing out across the nation
Mama in the front row, it's a celebration
Every sleepless night was a brick in the foundation
Paid the cost in full with a life of dedication
First one in the family, a whole new generation
Used to wait for trains at the end of the station

Stepping out the shadow, now I'm standing in the light
Every scar I carry is a medal from the fight
Pull up to the city and it's glowing every night
Proved 'em all wrong and I proved myself right
Used to fear the drop, now I'm living off the height
First class seat on a once-impossible flight

Everybody asking, everybody knows the name
Lit a tiny spark and I turned it to a flame
Changed the rules forever, now they're playing my game
Money came and went but my heart is still the same
Hung my first plaque in a hand-me-down frame
Never chased the spotlight, never begged for the fame`,love:`You were the first one that ever really saw me
Holding your hand is the closest thing to free
Eyes like the evening when the sun hits the sea
Every kind of future has you in it, you and me
Never had a home till you handed me a key
Every song I wrote was a letter, can't you see

Wrote your name in pencil on the inside of my heart
Every ending I imagined took me back to the start
Miles in between but we're never really apart
The way you laugh at nothing is a masterpiece of art
You the only light when the city gets dark
If I had to choose again, I'd still play the part

*Kitchen light is on and I can hear you crying
Said we'd make it work and I believe that we were trying
Every 'I'm alright' that you said, you were lying
Watched your plane take off and I felt the whole sky dying
Still I keep your sweater, there's no use in denying
Every star is out and I'm still here trying

Every time you whisper I can feel you getting close
Summer on the porch, nothing in the world beats those
Found it in the concrete, a stubborn little rose
Only one who's seen me at my worst, and she knows
Wherever this life takes me, that's where my heart goes
